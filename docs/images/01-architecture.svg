<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2C6BED"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1600" height="1080" fill="#FFFFFF"/>

  <text x="60" y="55" font-size="28" font-weight="700" fill="#0F172A">AImpact Content Agent — Architecture</text>
  <text x="60" y="82" font-size="15" fill="#6B7280">Source-driven agentic pipeline that reads AImpact scores &amp; sources, finds the gap, and publishes remediation content.</text>

  <g transform="translate(1050,50)" font-size="12" fill="#374151">
    <rect x="0" y="0" width="500" height="46" rx="6" fill="#F9FAFB" stroke="#E5E7EB"/>
    <line x1="14" y1="16" x2="44" y2="16" stroke="#2C6BED" stroke-width="2.4" marker-end="url(#arrowBlue)"/><text x="52" y="20">Read from AImpact</text>
    <line x1="180" y1="16" x2="210" y2="16" stroke="#374151" stroke-width="2.4" marker-end="url(#arrow)"/><text x="218" y="20">Agent flow</text>
    <line x1="310" y1="16" x2="340" y2="16" stroke="#059669" stroke-width="2.4" marker-end="url(#arrowGreen)"/><text x="348" y="20">Feedback / re-audit</text>
    <line x1="14" y1="34" x2="44" y2="34" stroke="#6B7280" stroke-width="2.4" stroke-dasharray="5,4"/><text x="52" y="38">Tool call (LLM)</text>
  </g>

  <!-- AIMPACT -->
  <g transform="translate(60,120)" filter="url(#shadow)">
    <rect width="1480" height="130" rx="12" fill="#EEF4FF" stroke="#2C6BED" stroke-width="1.5"/>
    <text x="20" y="30" font-size="18" font-weight="700" fill="#2C6BED">AImpact (existing — source of truth)</text>
    <g transform="translate(20,52)"><rect width="340" height="60" rx="8" fill="#FFFFFF" stroke="#93B4F7"/><text x="16" y="26" font-size="14" font-weight="600">Postgres</text><text x="16" y="46" font-size="12" fill="#4B5563">Projects · Campaigns · Prompts · AuditScores.sources</text></g>
    <g transform="translate(380,52)"><rect width="340" height="60" rx="8" fill="#FFFFFF" stroke="#93B4F7"/><text x="16" y="26" font-size="14" font-weight="600">REST API</text><text x="16" y="46" font-size="12" fill="#4B5563">/campaigns · /audit-results?include=sources</text></g>
    <g transform="translate(740,52)"><rect width="340" height="60" rx="8" fill="#FFFFFF" stroke="#93B4F7"/><text x="16" y="26" font-size="14" font-weight="600">Auth</text><text x="16" y="46" font-size="12" fill="#4B5563">Scoped token · Authorization: Bearer at_…</text></g>
    <g transform="translate(1100,52)"><rect width="360" height="60" rx="8" fill="#FFFFFF" stroke="#93B4F7"/><text x="16" y="26" font-size="14" font-weight="600">Trigger</text><text x="16" y="46" font-size="12" fill="#4B5563">POST /audit-campaign/start (re-score)</text></g>
  </g>

  <line x1="800" y1="252" x2="800" y2="296" stroke="#2C6BED" stroke-width="2.4" marker-end="url(#arrowBlue)"/>
  <text x="812" y="280" font-size="12" fill="#2C6BED">low-scoring prompts + model responses + cited sources</text>

  <!-- ORCHESTRATOR -->
  <g transform="translate(60,300)" filter="url(#shadow)">
    <rect width="1480" height="430" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="20" y="30" font-size="18" font-weight="700" fill="#0F172A">ACA Orchestrator</text>
    <text x="20" y="50" font-size="13" fill="#6B7280">FastAPI + LangGraph · typed inputs / outputs · every hop persisted &amp; traced</text>

    <!-- Five agents -->
    <g font-size="14" fill="#0F172A">
      <g transform="translate(40,90)">
        <rect width="260" height="120" rx="10" fill="#FFFFFF" stroke="#94A3B8"/>
        <text x="16" y="28" font-weight="700">1 · Source Analyzer</text>
        <text x="16" y="50" font-size="12" fill="#4B5563">Haiku 4.5</text>
        <text x="16" y="70" font-size="12" fill="#4B5563">Reads what competitors are</text>
        <text x="16" y="86" font-size="12" fill="#4B5563">cited for; extracts themes</text>
        <text x="16" y="106" font-size="12" fill="#4B5563">→ gap + editorial angle</text>
      </g>
      <g transform="translate(320,90)">
        <rect width="260" height="120" rx="10" fill="#FFFFFF" stroke="#94A3B8"/>
        <text x="16" y="28" font-weight="700">2 · Brief</text>
        <text x="16" y="50" font-size="12" fill="#4B5563">Sonnet</text>
        <text x="16" y="70" font-size="12" fill="#4B5563">Title · slug · meta</text>
        <text x="16" y="86" font-size="12" fill="#4B5563">H2 outline · FAQs</text>
        <text x="16" y="106" font-size="12" fill="#4B5563">internal-link targets</text>
      </g>
      <g transform="translate(600,90)">
        <rect width="260" height="120" rx="10" fill="#FFFFFF" stroke="#94A3B8"/>
        <text x="16" y="28" font-weight="700">3 · Writer</text>
        <text x="16" y="50" font-size="12" fill="#4B5563">Sonnet</text>
        <text x="16" y="70" font-size="12" fill="#4B5563">1.2–2k word Markdown</text>
        <text x="16" y="86" font-size="12" fill="#4B5563">+ schema.org FAQ JSON-LD</text>
      </g>
      <g transform="translate(880,90)">
        <rect width="260" height="120" rx="10" fill="#FFFFFF" stroke="#94A3B8"/>
        <text x="16" y="28" font-weight="700">4 · Reviewer</text>
        <text x="16" y="50" font-size="12" fill="#4B5563">Sonnet + rubric</text>
        <text x="16" y="70" font-size="12" fill="#4B5563">Grounding · brand voice</text>
        <text x="16" y="86" font-size="12" fill="#4B5563">approve / revise / reject</text>
      </g>

      <!-- Arrows between agents -->
      <line x1="300" y1="150" x2="320" y2="150" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>
      <line x1="580" y1="150" x2="600" y2="150" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>
      <line x1="860" y1="150" x2="880" y2="150" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>

      <!-- Revise loop -->
      <path d="M 1010,90 C 1010,50 730,50 730,90" fill="none" stroke="#D97706" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
      <text x="780" y="42" font-size="11" fill="#B45309">revise (max 2 loops)</text>
    </g>

    <!-- Human gate -->
    <g transform="translate(40,240)">
      <rect width="1400" height="80" rx="10" fill="#FEF3C7" stroke="#D97706"/>
      <text x="20" y="30" font-size="15" font-weight="700" fill="#7C2D12">HUMAN APPROVAL GATE — Content Studio (new /content route in AImpact UI)</text>
      <text x="20" y="52" font-size="12" fill="#7C2D12">Editor reviews brief + draft side-by-side · inline edits · picks publish time · clicks Approve</text>
      <text x="20" y="70" font-size="12" fill="#7C2D12">Nothing reaches WordPress without this click. Same httpOnly cookie session as AImpact — no separate login.</text>
    </g>

    <line x1="1010" y1="210" x2="1010" y2="240" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>
    <text x="1022" y="230" font-size="11" fill="#374151">approve</text>
    <line x1="1310" y1="320" x2="1310" y2="360" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>

    <!-- Publisher -->
    <g transform="translate(1180,360)">
      <rect width="260" height="70" rx="10" fill="#DCFCE7" stroke="#059669"/>
      <text x="16" y="26" font-size="14" font-weight="700" fill="#065F46">5 · Publisher</text>
      <text x="16" y="46" font-size="12" fill="#065F46">POST /wp/v2/posts</text>
      <text x="16" y="62" font-size="12" fill="#065F46">status=future + date</text>
    </g>
  </g>

  <!-- EXTERNAL TOOLS bottom row -->
  <g font-size="13" fill="#0F172A">
    <g transform="translate(430,790)" filter="url(#shadow)">
      <rect width="320" height="80" rx="10" fill="#FFFFFF" stroke="#94A3B8"/>
      <text x="16" y="28" font-size="14" font-weight="700">Anthropic Claude</text>
      <text x="16" y="50" font-size="12" fill="#4B5563">Haiku (Source Analyzer)</text>
      <text x="16" y="68" font-size="12" fill="#4B5563">Sonnet (Brief · Writer · Reviewer)</text>
    </g>
    <line x1="590" y1="730" x2="590" y2="790" stroke="#6B7280" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

    <g transform="translate(1120,790)" filter="url(#shadow)">
      <rect width="320" height="80" rx="10" fill="#FFFFFF" stroke="#94A3B8"/>
      <text x="16" y="28" font-size="14" font-weight="700">WordPress site</text>
      <text x="16" y="50" font-size="12" fill="#4B5563">REST API · application password</text>
      <text x="16" y="68" font-size="12" fill="#4B5563">per-tenant, KMS-encrypted</text>
    </g>
    <line x1="1310" y1="730" x2="1310" y2="790" stroke="#6B7280" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  </g>

  <!-- ACA Postgres -->
  <g transform="translate(60,790)" filter="url(#shadow)">
    <rect width="220" height="80" rx="10" fill="#F5F3FF" stroke="#7C3AED"/>
    <text x="16" y="26" font-size="14" font-weight="700" fill="#5B21B6">ACA Postgres</text>
    <text x="16" y="48" font-size="12" fill="#5B21B6">jobs · gaps · briefs</text>
    <text x="16" y="66" font-size="12" fill="#5B21B6">drafts · publications · traces</text>
  </g>
  <line x1="170" y1="730" x2="170" y2="790" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Feedback loop -->
  <path d="M 1540,790 C 1580,790 1580,180 1540,180" fill="none" stroke="#059669" stroke-width="2.4" marker-end="url(#arrowGreen)"/>
  <text x="1490" y="500" font-size="12" fill="#059669" transform="rotate(-90 1490 500)">Feedback: re-audit at day 7 + 30, attribute lift</text>

  <text x="60" y="1050" font-size="11" fill="#9CA3AF">v0.2 · Source-driven flow · Aditya Pasare · 2026-09-29</text>
</svg>
