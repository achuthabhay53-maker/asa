<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1200" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
    <marker id="arBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2C6BED"/></marker>
    <marker id="arGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1900" height="1200" fill="#FFFFFF"/>

  <text x="60" y="55" font-size="30" font-weight="700" fill="#0F172A">AImpact Content Agent — System Architecture</text>
  <text x="60" y="82" font-size="15" fill="#6B7280">Deployment topology, data stores, external SaaS. ACA runs as a sidecar to AImpact on shared AWS + Neon infrastructure.</text>

  <g transform="translate(1370,45)" font-size="12" fill="#374151">
    <rect x="0" y="0" width="500" height="60" rx="6" fill="#F9FAFB" stroke="#E5E7EB"/>
    <line x1="14" y1="18" x2="44" y2="18" stroke="#2C6BED" stroke-width="2.4" marker-end="url(#arBlue)"/><text x="52" y="22">HTTPS / REST</text>
    <line x1="180" y1="18" x2="210" y2="18" stroke="#7C3AED" stroke-width="2.4" marker-end="url(#arPurple)"/><text x="218" y="22">DB / cache</text>
    <line x1="310" y1="18" x2="340" y2="18" stroke="#059669" stroke-width="2.4" marker-end="url(#arGreen)"/><text x="348" y="22">Egress to SaaS</text>
    <rect x="180" y="35" width="14" height="14" fill="#EEF4FF" stroke="#2C6BED"/><text x="200" y="46">Existing AImpact</text>
    <rect x="310" y="35" width="14" height="14" fill="#F5F3FF" stroke="#7C3AED"/><text x="330" y="46">New ACA</text>
  </g>

  <!-- USERS -->
  <g transform="translate(60,130)">
    <rect width="1780" height="90" rx="10" fill="#F1F5F9" stroke="#94A3B8"/>
    <text x="16" y="26" font-size="14" font-weight="700" fill="#0F172A">USERS</text>
    <g transform="translate(30,40)" filter="url(#sh)"><rect width="240" height="40" rx="6" fill="#FFFFFF" stroke="#94A3B8"/><text x="16" y="26" font-size="12" font-weight="600">Marketing team · Editor · CEO</text></g>
    <g transform="translate(300,40)" filter="url(#sh)"><rect width="240" height="40" rx="6" fill="#FFFFFF" stroke="#94A3B8"/><text x="16" y="26" font-size="12" font-weight="600">Server-to-server (API token at_…)</text></g>
    <text x="560" y="65" font-size="11" fill="#6B7280">Browser + httpOnly JWT cookie   ·   or   Authorization: Bearer at_…</text>
  </g>

  <!-- CDN -->
  <g transform="translate(60,240)">
    <rect width="1780" height="90" rx="10" fill="#FEF3C7" stroke="#D97706"/>
    <text x="16" y="26" font-size="14" font-weight="700" fill="#7C2D12">EDGE · CloudFront (one domain fronts everything)</text>
    <g transform="translate(30,40)" filter="url(#sh)"><rect width="360" height="40" rx="6" fill="#FFFFFF" stroke="#D97706"/><text x="16" y="26" font-size="12" font-weight="600">CloudFront distribution · TLS · WAF · Turnstile</text></g>
    <text x="420" y="65" font-size="12" fill="#7C2D12">Path routing:  /  →  Amplify (frontend)   ·   /api/*  →  AImpact backend   ·   /api/aca/*  →  ACA backend</text>
  </g>

  <!-- FRONTEND -->
  <g transform="translate(60,350)">
    <rect width="1780" height="120" rx="10" fill="#EEF4FF" stroke="#2C6BED"/>
    <text x="16" y="26" font-size="14" font-weight="700" fill="#2C6BED">FRONTEND · AWS Amplify (Next.js 14 App Router) — shared app, no separate ACA UI</text>
    <g transform="translate(30,42)" filter="url(#sh)"><rect width="330" height="60" rx="8" fill="#FFFFFF" stroke="#93B4F7"/><text x="16" y="24" font-size="13" font-weight="700">AImpact routes (existing)</text><text x="16" y="44" font-size="11" fill="#4B5563">/dashboard · /login · /pricing · /settings</text></g>
    <g transform="translate(390,42)" filter="url(#sh)"><rect width="330" height="60" rx="8" fill="#F5F3FF" stroke="#7C3AED"/><text x="16" y="24" font-size="13" font-weight="700" fill="#5B21B6">/content — Content Studio (new)</text><text x="16" y="44" font-size="11" fill="#5B21B6">Brief + draft split view · inline edit · approve</text></g>
    <g transform="translate(750,42)" filter="url(#sh)"><rect width="330" height="60" rx="8" fill="#FFFFFF" stroke="#93B4F7"/><text x="16" y="24" font-size="13" font-weight="700">Shared providers</text><text x="16" y="44" font-size="11" fill="#4B5563">AuthProvider · ProjectProvider · PaywallProvider</text></g>
    <g transform="translate(1110,42)" filter="url(#sh)"><rect width="330" height="60" rx="8" fill="#FFFFFF" stroke="#93B4F7"/><text x="16" y="24" font-size="13" font-weight="700">lib/api.js</text><text x="16" y="44" font-size="11" fill="#4B5563">fetch wrapper · credentials: 'include'</text></g>
  </g>

  <!-- BACKEND -->
  <g transform="translate(60,490)">
    <rect width="1160" height="360" rx="10" fill="#F8FAFC" stroke="#334155"/>
    <text x="16" y="26" font-size="14" font-weight="700" fill="#0F172A">BACKEND · AWS App Runner (source-code deploy · Python 3.11 · autoscale)</text>

    <!-- AImpact backend -->
    <g transform="translate(30,50)" filter="url(#sh)">
      <rect width="540" height="290" rx="10" fill="#EEF4FF" stroke="#2C6BED" stroke-width="1.5"/>
      <text x="16" y="26" font-size="14" font-weight="700" fill="#2C6BED">AImpact backend  (existing)</text>
      <text x="16" y="44" font-size="11" fill="#2C6BED">FastAPI · uvicorn · port 8001</text>
      <g transform="translate(16,60)"><rect width="240" height="60" rx="6" fill="#FFFFFF" stroke="#93B4F7"/><text x="12" y="22" font-size="12" font-weight="700">API routes</text><text x="12" y="40" font-size="10" fill="#4B5563">/projects · /campaigns · /audit-*</text><text x="12" y="52" font-size="10" fill="#4B5563">/billing/* · /tokens · /webhooks/*</text></g>
      <g transform="translate(272,60)"><rect width="240" height="60" rx="6" fill="#FFFFFF" stroke="#93B4F7"/><text x="12" y="22" font-size="12" font-weight="700">Audit workers</text><text x="12" y="40" font-size="10" fill="#4B5563">async ThreadPoolExecutor</text><text x="12" y="52" font-size="10" fill="#4B5563">4 AI providers in parallel</text></g>
      <g transform="translate(16,132)"><rect width="240" height="60" rx="6" fill="#FFFFFF" stroke="#93B4F7"/><text x="12" y="22" font-size="12" font-weight="700">APScheduler</text><text x="12" y="40" font-size="10" fill="#4B5563">daily audits · trial reminders</text></g>
      <g transform="translate(272,132)"><rect width="240" height="60" rx="6" fill="#FFFFFF" stroke="#93B4F7"/><text x="12" y="22" font-size="12" font-weight="700">Auth</text><text x="12" y="40" font-size="10" fill="#4B5563">JWT cookie · OAuth · OTP · API tokens</text></g>
      <g transform="translate(16,204)"><rect width="496" height="72" rx="6" fill="#FFFFFF" stroke="#93B4F7"/><text x="12" y="22" font-size="12" font-weight="700">Additive endpoints for ACA</text><text x="12" y="42" font-size="11" fill="#4B5563">GET /campaigns/{id}/content-gaps · POST /webhooks/audit-completed</text><text x="12" y="58" font-size="11" fill="#4B5563">usage_events: content_brief_created · content_published · content_lift_measured</text></g>
    </g>

    <!-- ACA backend -->
    <g transform="translate(590,50)" filter="url(#sh)">
      <rect width="540" height="290" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
      <text x="16" y="26" font-size="14" font-weight="700" fill="#5B21B6">ACA backend  (new)</text>
      <text x="16" y="44" font-size="11" fill="#5B21B6">FastAPI · uvicorn · port 8002 · apprunner.yaml</text>
      <g transform="translate(16,60)"><rect width="240" height="60" rx="6" fill="#FFFFFF" stroke="#C4B5FD"/><text x="12" y="22" font-size="12" font-weight="700">API routes</text><text x="12" y="40" font-size="10" fill="#4B5563">/aca/jobs · /aca/drafts</text><text x="12" y="52" font-size="10" fill="#4B5563">/aca/publications · /aca/tenants</text></g>
      <g transform="translate(272,60)"><rect width="240" height="60" rx="6" fill="#FFFFFF" stroke="#C4B5FD"/><text x="12" y="22" font-size="12" font-weight="700">Orchestrator</text><text x="12" y="40" font-size="10" fill="#4B5563">LangGraph state machine</text><text x="12" y="52" font-size="10" fill="#4B5563">checkpointer → aca_jobs</text></g>
      <g transform="translate(16,132)"><rect width="240" height="60" rx="6" fill="#FFFFFF" stroke="#C4B5FD"/><text x="12" y="22" font-size="12" font-weight="700">Agent pool (5)</text><text x="12" y="40" font-size="10" fill="#4B5563">SourceAnalyzer · Brief · Writer</text><text x="12" y="52" font-size="10" fill="#4B5563">Reviewer · Publisher</text></g>
      <g transform="translate(272,132)"><rect width="240" height="60" rx="6" fill="#FFFFFF" stroke="#C4B5FD"/><text x="12" y="22" font-size="12" font-weight="700">Workers</text><text x="12" y="40" font-size="10" fill="#4B5563">APScheduler · async runner</text><text x="12" y="52" font-size="10" fill="#4B5563">day-7 / day-30 feedback</text></g>
      <g transform="translate(16,204)"><rect width="496" height="72" rx="6" fill="#FFFFFF" stroke="#C4B5FD"/><text x="12" y="22" font-size="12" font-weight="700">Tool clients</text><text x="12" y="42" font-size="11" fill="#4B5563">tools/aimpact.py       · Bearer at_… scoped token</text><text x="12" y="58" font-size="11" fill="#4B5563">tools/claude.py · tools/wordpress.py · tools/langfuse.py</text></g>
    </g>
  </g>

  <!-- DATA -->
  <g transform="translate(1240,490)">
    <rect width="600" height="360" rx="10" fill="#F1F5F9" stroke="#334155"/>
    <text x="16" y="26" font-size="14" font-weight="700" fill="#0F172A">DATA · SECRETS · STORAGE</text>
    <g transform="translate(20,50)" filter="url(#sh)"><rect width="560" height="72" rx="8" fill="#EEF4FF" stroke="#2C6BED"/><text x="16" y="24" font-size="13" font-weight="700" fill="#2C6BED">Neon Postgres · AImpact DB</text><text x="16" y="44" font-size="11" fill="#2C6BED">Projects · Campaigns · CampaignPrompts · AuditScores · Users · Subscriptions</text><text x="16" y="60" font-size="11" fill="#2C6BED">pool_pre_ping · SSL · read via REST from ACA</text></g>
    <g transform="translate(20,132)" filter="url(#sh)"><rect width="560" height="72" rx="8" fill="#F5F3FF" stroke="#7C3AED"/><text x="16" y="24" font-size="13" font-weight="700" fill="#5B21B6">Neon Postgres · ACA DB (separate database, same project)</text><text x="16" y="44" font-size="11" fill="#5B21B6">aca_tenants · aca_jobs · aca_gaps</text><text x="16" y="60" font-size="11" fill="#5B21B6">aca_briefs · aca_drafts (versioned) · aca_publications · aca_agent_traces</text></g>
    <g transform="translate(20,214)" filter="url(#sh)"><rect width="272" height="72" rx="8" fill="#FFFFFF" stroke="#94A3B8"/><text x="16" y="24" font-size="13" font-weight="700">S3 / Supabase Storage</text><text x="16" y="44" font-size="11" fill="#4B5563">draft artifacts (large payloads)</text></g>
    <g transform="translate(308,214)" filter="url(#sh)"><rect width="272" height="72" rx="8" fill="#FFFFFF" stroke="#94A3B8"/><text x="16" y="24" font-size="13" font-weight="700">AWS KMS / Secrets Manager</text><text x="16" y="44" font-size="11" fill="#4B5563">WP application passwords</text><text x="16" y="60" font-size="11" fill="#4B5563">API keys</text></g>
    <g transform="translate(20,296)" filter="url(#sh)"><rect width="560" height="50" rx="8" fill="#FFFFFF" stroke="#94A3B8"/><text x="16" y="24" font-size="13" font-weight="700">AWS SES</text><text x="16" y="40" font-size="11" fill="#4B5563">Transactional email — OTP, verification, reminders (AImpact only)</text></g>
  </g>

  <!-- EXTERNAL SaaS -->
  <g transform="translate(60,880)">
    <rect width="1780" height="220" rx="10" fill="#ECFEFF" stroke="#059669"/>
    <text x="16" y="26" font-size="14" font-weight="700" fill="#059669">EXTERNAL SaaS · egress from ACA backend + AImpact backend</text>

    <g transform="translate(30,50)" filter="url(#sh)"><rect width="340" height="90" rx="8" fill="#FFFFFF" stroke="#059669"/><text x="16" y="24" font-size="13" font-weight="700">Anthropic Claude</text><text x="16" y="44" font-size="11" fill="#4B5563">Haiku 4.5 → Source Analyzer</text><text x="16" y="60" font-size="11" fill="#4B5563">Sonnet → Brief · Writer · Reviewer</text><text x="16" y="76" font-size="11" fill="#4B5563">Prompt-caching brand-voice rubric</text></g>
    <g transform="translate(390,50)" filter="url(#sh)"><rect width="340" height="90" rx="8" fill="#FFFFFF" stroke="#059669"/><text x="16" y="24" font-size="13" font-weight="700">Google Vertex AI · Gemini</text><text x="16" y="44" font-size="11" fill="#4B5563">AImpact audit (existing)</text><text x="16" y="60" font-size="11" fill="#4B5563">Not used by ACA directly</text></g>
    <g transform="translate(750,50)" filter="url(#sh)"><rect width="340" height="90" rx="8" fill="#FFFFFF" stroke="#059669"/><text x="16" y="24" font-size="13" font-weight="700">WordPress sites (per tenant)</text><text x="16" y="44" font-size="11" fill="#4B5563">POST /wp/v2/posts</text><text x="16" y="60" font-size="11" fill="#4B5563">Application Password auth · KMS-encrypted at rest</text></g>
    <g transform="translate(1110,50)" filter="url(#sh)"><rect width="340" height="90" rx="8" fill="#FFFFFF" stroke="#059669"/><text x="16" y="24" font-size="13" font-weight="700">Langfuse</text><text x="16" y="44" font-size="11" fill="#4B5563">Trace/eval store (ACA)</text><text x="16" y="60" font-size="11" fill="#4B5563">Tokens · cost · latency per hop</text></g>
    <g transform="translate(1470,50)" filter="url(#sh)"><rect width="280" height="90" rx="8" fill="#FFFFFF" stroke="#059669"/><text x="16" y="24" font-size="13" font-weight="700">OAuth · Turnstile · Razorpay</text><text x="16" y="44" font-size="11" fill="#4B5563">AImpact only</text><text x="16" y="60" font-size="11" fill="#4B5563">(social login · anti-bot · billing)</text></g>

    <g transform="translate(30,150)" filter="url(#sh)"><rect width="1720" height="60" rx="8" fill="#F9FAFB" stroke="#94A3B8"/><text x="16" y="24" font-size="13" font-weight="700">Multi-tenant guard rails</text><text x="16" y="42" font-size="11" fill="#4B5563">Per-tenant daily USD cap on Claude spend · row-level tenant_id checks on every read · WP creds never cross tenants · ACA pauses new jobs when AImpact audit budget is exhausted</text></g>
  </g>

  <!-- ARROWS -->
  <line x1="950" y1="220" x2="950" y2="240" stroke="#2C6BED" stroke-width="2.4" marker-end="url(#arBlue)"/>
  <line x1="300" y1="330" x2="300" y2="350" stroke="#2C6BED" stroke-width="2.4" marker-end="url(#arBlue)"/>
  <line x1="700" y1="330" x2="700" y2="490" stroke="#2C6BED" stroke-width="2.4" marker-end="url(#arBlue)"/>
  <line x1="1200" y1="330" x2="1200" y2="490" stroke="#2C6BED" stroke-width="2.4" marker-end="url(#arBlue)"/>

  <line x1="570" y1="640" x2="1240" y2="580" stroke="#7C3AED" stroke-width="2.2" marker-end="url(#arPurple)"/>
  <line x1="1130" y1="640" x2="1240" y2="660" stroke="#7C3AED" stroke-width="2.2" marker-end="url(#arPurple)"/>
  <line x1="1130" y1="700" x2="1240" y2="740" stroke="#7C3AED" stroke-width="2.2" marker-end="url(#arPurple)"/>

  <path d="M 590,700 C 570,760 610,760 590,760" fill="none" stroke="#2C6BED" stroke-width="2.4" marker-end="url(#arBlue)"/>
  <text x="470" y="770" font-size="11" fill="#2C6BED">ACA calls AImpact REST (Bearer at_…)</text>

  <g stroke="#059669" stroke-width="2.2" marker-end="url(#arGreen)">
    <line x1="200" y1="850" x2="200" y2="880"/>
    <line x1="560" y1="850" x2="560" y2="880"/>
    <line x1="920" y1="850" x2="920" y2="880"/>
    <line x1="1280" y1="850" x2="1280" y2="880"/>
    <line x1="1610" y1="850" x2="1610" y2="880"/>
  </g>

  <text x="60" y="1170" font-size="11" fill="#9CA3AF">AImpact Content Agent · system architecture · v0.2 (source-driven) · Aditya Pasare · 2026-09-29</text>
